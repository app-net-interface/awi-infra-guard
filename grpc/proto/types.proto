syntax = "proto3";
package infra;

option go_package = "./;infrapb";
import "google/protobuf/timestamp.proto";
//import "types_k8s.proto";

message Error {
    int32 code = 1;
    string errorMessage = 2;
    string serverity = 3;
}

message AwsRole {
    string role_arn = 1; // AWS: Role ARN
    string role_session_name = 2; // AWS: Session Name
    int32 duration_seconds = 3; // Optional: Session duration in seconds
}

message GcpRole {
    string service_account = 1; // GCP: Service Account Email
}

message AzureRole {
    string managed_identity = 1; // Azure: Managed Identity Client ID
}

message RoleBasedAuth {
    oneof role {
        AwsRole aws_role = 1;
        GcpRole gcp_role = 2;
        AzureRole azure_role = 3;
    }
}

message AwsUserAuth {
    string access_key_id = 1; // AWS: Access Key ID
    string secret_access_key = 2; // AWS: Secret Access Key
    string session_token = 3; // Optional: Session Token for temporary credentials
}

message GcpUserAuth {
    oneof auth_method {
        string api_key = 1; // GCP: API Key
        string json_key = 2; // GCP: Service Account JSON key file content
    }
}

message AzureUserAuth {
    string client_id = 1; // Azure: Client ID
    string client_secret = 2; // Azure: Client Secret
    string tenant_id = 3; // Azure: Tenant ID
    string certificate_path = 4; // Optional: Path to certificate file for certificate-based auth
}

message VmwareUserAuth {
    string username = 1;        // vCenter username
    string password = 2;        // vCenter password
    string vcenter_url = 3;     // vCenter server URL
    bool insecure = 4;         // Skip SSL verification
    string datacenter = 5;      // Default datacenter
}

message UserBasedAuth {
    oneof user_auth {
        AwsUserAuth aws_user_auth = 1;
        GcpUserAuth gcp_user_auth = 2;
        AzureUserAuth azure_user_auth = 3;
        VmwareUserAuth vmware_user_auth = 4;
    }
}

message Credentials {
    oneof auth {
        RoleBasedAuth role_based_auth = 1;
        UserBasedAuth user_based_auth = 2;
    }
}

message Account {
    string provider = 1;
    string id = 2;
    string name = 3;
    string last_sync_time = 4;
}
message Region {
    string provider = 1;
    string id = 2;
    string name = 3;
    string last_sync_time = 4;
}


message VPC {
    string id = 1;
    string name = 2;
    string region = 3;
    map<string, string> labels = 4;
    string ipv4_cidr = 5;
    string ipv6_cidr = 6;
    string project = 7;
    string provider = 10;
    string account_id = 11;
    string last_sync_time = 12;
    string self_link = 13;
    google.protobuf.Timestamp created_at = 17;
    google.protobuf.Timestamp updated_at = 18;
}

message VPCIndex {
    string vpc_id = 1;
    repeated string instance_ids = 2;
    repeated string acl_ids = 3;
    repeated string security_group_ids = 4;
    repeated string nat_gateway_ids = 5;
    repeated string vpc_endpoint_ids = 6;
    repeated string lb_ids = 7;
    repeated string router_ids = 8;
    repeated string igw_ids = 9;
    repeated string subnet_ids = 10;
    repeated string route_table_ids = 11;
    repeated string network_interface_ids = 12;
    repeated string key_pair_ids = 13;
    repeated string vpn_concentrator_ids = 14;
    repeated string public_ip_ids = 15;
    repeated string cluster_ids = 16;
    string last_sync_time = 17;
    string provider = 18;
    string account_id = 19;
    string region = 20;
    google.protobuf.Timestamp created_at = 21;
    google.protobuf.Timestamp updated_at = 22;
    
    // Security risk classifications - populated during post-processing
    VPCSecurityRisks security_risks = 23;
}

// Security risk categorization for VPC resources
message VPCSecurityRisks {
    // Critical risk resources (immediate attention required)
    repeated string critical_instance_ids = 1;          // Instances with public IP + open SSH/RDP
    repeated string critical_security_group_ids = 2;    // SGs with 0.0.0.0/0 on critical ports
    repeated string critical_lb_ids = 3;                // Internet-facing LBs with risky backends
    
    // High risk resources (significant security concerns)
    repeated string high_risk_instance_ids = 4;         // Public instances with database ports exposed
    repeated string high_risk_security_group_ids = 5;   // SGs with wide port ranges open
    repeated string high_risk_subnet_ids = 6;           // Subnets with mixed public/private resources
    
    // Medium risk resources (best practice violations)
    repeated string medium_risk_instance_ids = 7;       // Untagged instances
    repeated string medium_risk_security_group_ids = 8; // Unused or overly permissive SGs
    repeated string medium_risk_acl_ids = 9;            // ACLs with broad rules
    
    // Compliance violations
    repeated string untagged_instance_ids = 10;
    repeated string untagged_security_group_ids = 11;
    repeated string untagged_subnet_ids = 12;
    repeated string untagged_lb_ids = 13;
    
    // Network topology risks
    repeated string isolated_subnet_ids = 14;           // Subnets with no route to internet
    repeated string over_exposed_subnet_ids = 15;       // Subnets with multiple IGW routes
    
    google.protobuf.Timestamp last_risk_analysis = 16;  // When risk analysis was performed
    string risk_analysis_version = 17;                  // Version of risk analysis rules used
}

// Detailed security analysis for a VPC - companion to VPCIndex
message VPCSecurityAnalysis {
    string vpc_id = 1;
    string provider = 2;
    string account_id = 3;
    string region = 4;
    
    // Detailed risk findings with context
    repeated SecurityFinding findings = 5;
    
    // Risk summary metrics
    int32 critical_findings_count = 6;
    int32 high_findings_count = 7;
    int32 medium_findings_count = 8;
    int32 low_findings_count = 9;
    
    // Overall risk score (0-100, where 100 is highest risk)
    int32 risk_score = 10;
    
    google.protobuf.Timestamp last_analyzed = 11;
    string analysis_version = 12;
}

// Individual security finding with actionable details
message SecurityFinding {
    string id = 1;                          // Unique finding ID
    string resource_id = 2;                 // The resource that has the issue
    string resource_type = 3;               // "Instance", "SecurityGroup", "LoadBalancer", etc.
    
    enum RiskLevel {
        RISK_LEVEL_UNSPECIFIED = 0;
        LOW = 1;
        MEDIUM = 2;
        HIGH = 3;
        CRITICAL = 4;
    }
    RiskLevel risk_level = 4;
    
    enum FindingType {
        FINDING_TYPE_UNSPECIFIED = 0;
        OPEN_SSH_ACCESS = 1;                // SSH (22) open to 0.0.0.0/0
        OPEN_RDP_ACCESS = 2;                // RDP (3389) open to 0.0.0.0/0
        OPEN_DATABASE_ACCESS = 3;           // Database ports open to internet
        OVERLY_PERMISSIVE_SG = 4;           // Security group with broad rules
        PUBLIC_INSTANCE_NO_TAGS = 5;        // Public instance without proper tags
        INTERNET_FACING_LB_RISKY_BACKEND = 6; // Internet-facing LB with insecure backends
        CROSS_SUBNET_EXPOSURE = 7;          // Network path allowing unintended access
        UNUSED_SECURITY_GROUP = 8;          // Security group not attached to any resource
        UNENCRYPTED_STORAGE = 9;            // Storage without encryption
        WEAK_NETWORK_ACL = 10;              // Network ACL with overly broad rules
    }
    FindingType finding_type = 5;
    
    string title = 6;                       // Human-readable title
    string description = 7;                 // Detailed description of the issue
    string remediation = 8;                 // Suggested fix
    
    // Contextual information for drill-down
    repeated string related_resource_ids = 9; // Other resources involved in this finding
    map<string, string> finding_details = 10; // Additional context (ports, CIDRs, etc.)
    
    google.protobuf.Timestamp detected_at = 11;
}

// Security status for an individual instance - for UI warnings and alerts
message InstanceSecurityStatus {
    enum RiskLevel {
        RISK_LEVEL_UNSPECIFIED = 0;
        SECURE = 1;          // No security issues detected
        LOW_RISK = 2;        // Minor issues (untagged, etc.)
        MEDIUM_RISK = 3;     // Notable concerns (public IP with some exposure)
        HIGH_RISK = 4;       // Significant issues (database ports exposed)
        CRITICAL_RISK = 5;   // Immediate attention needed (SSH/RDP open to world)
    }
    RiskLevel overall_risk_level = 1;
    
    // Quick status flags for UI display
    bool is_publicly_accessible = 2;           // Has public IP
    bool has_open_ssh_access = 3;              // SSH (22) open to 0.0.0.0/0
    bool has_open_rdp_access = 4;              // RDP (3389) open to 0.0.0.0/0
    bool has_open_database_ports = 5;          // Database ports exposed to internet
    bool is_untagged = 6;                      // Missing required tags
    bool has_overly_permissive_sg = 7;         // Security groups with broad access
    
    // Summary for UI tooltips/details
    repeated string risk_summary = 8;          // Human-readable risk descriptions
    repeated string exposed_ports = 9;         // List of risky ports that are exposed
    repeated string risky_security_groups = 10; // SG IDs that contribute to risk
    
    // Action recommendations for UI
    repeated string recommendations = 11;       // Suggested actions to improve security
    
    google.protobuf.Timestamp last_assessed = 12;  // When security was last evaluated
}

// Security risk status for a security group - for UI warnings
message SecurityGroupRiskStatus {
    enum RiskLevel {
        RISK_LEVEL_UNSPECIFIED = 0;
        SECURE = 1;          // No concerning rules
        LOW_RISK = 2;        // Minor issues (untagged, etc.)
        MEDIUM_RISK = 3;     // Some overly broad rules
        HIGH_RISK = 4;       // Database ports open to internet
        CRITICAL_RISK = 5;   // SSH/RDP open to 0.0.0.0/0
    }
    RiskLevel overall_risk_level = 1;
    
    // Quick flags for UI display
    bool allows_ssh_from_internet = 2;         // SSH (22) from 0.0.0.0/0
    bool allows_rdp_from_internet = 3;         // RDP (3389) from 0.0.0.0/0
    bool allows_database_from_internet = 4;    // Database ports from 0.0.0.0/0
    bool has_wide_port_ranges = 5;             // Rules with large port ranges
    bool is_unused = 6;                        // Not attached to any instances
    bool is_untagged = 7;                      // Missing required tags
    
    // Details for UI tooltips
    repeated string risky_rules = 8;           // Human-readable descriptions of risky rules
    repeated string affected_instances = 9;    // Instance IDs that use this SG
    int32 attached_instance_count = 10;        // Number of instances using this SG
    
    // Recommendations
    repeated string recommendations = 11;       // Suggested security improvements
    
    google.protobuf.Timestamp last_assessed = 12;
}

// Security status for load balancers - for UI warnings
message LoadBalancerSecurityStatus {
    enum RiskLevel {
        RISK_LEVEL_UNSPECIFIED = 0;
        SECURE = 1;          // Internal LB with secure backends
        LOW_RISK = 2;        // Minor issues (untagged, etc.)
        MEDIUM_RISK = 3;     // Internet-facing with some concerns
        HIGH_RISK = 4;       // Internet-facing with risky backend instances
        CRITICAL_RISK = 5;   // Internet-facing with critically exposed backends
    }
    RiskLevel overall_risk_level = 1;
    
    // Quick flags for UI display
    bool is_internet_facing = 2;              // Scheme is "internet-facing"
    bool has_risky_backend_instances = 3;     // Backend instances have security issues
    bool has_insecure_listeners = 4;          // HTTP instead of HTTPS
    bool is_untagged = 5;                     // Missing required tags
    bool has_overly_permissive_sg = 6;        // Associated SGs have broad access
    
    // Backend security details
    int32 total_backend_instances = 7;        // Total instances behind this LB
    int32 risky_backend_instances = 8;        // Backend instances with security issues
    repeated string risky_backend_instance_ids = 9; // IDs of risky backend instances
    
    // Listener security details
    repeated string insecure_listeners = 10;  // Listeners using HTTP instead of HTTPS
    repeated string security_group_issues = 11; // SG-related security concerns
    
    // Recommendations
    repeated string recommendations = 12;      // Suggested security improvements
    
    google.protobuf.Timestamp last_assessed = 13;
}

message Instance {
    string provider = 1;
    string account_id = 2;
    string id = 3;
    string name = 4;
    string subnetID = 5;
    string project = 6;
    string vpcId = 7;
    string region = 8;
    string zone = 9;
    string publicIP = 10;
    string privateIP = 11;
    repeated string securityGroupIds = 12;
    repeated string interfaceIds = 13;
    string state = 14;
    string type = 15;
    map<string, string> labels = 16;
    google.protobuf.Timestamp created_at = 17;
    google.protobuf.Timestamp updated_at = 18;
    string last_sync_time = 19;
    string self_link = 20;
    
    // Security risk assessment - populated during post-processing
    InstanceSecurityStatus security_status = 21;
}

message Subnet {
    string id = 1;
    string name = 2;
    string cidr_block = 3;
    string vpc_id = 4;
    string zone = 5;
    string region = 6;
    map<string, string> labels = 7;
    string project = 8;
    string provider = 10;
    string account_id = 11;
    string last_sync_time = 12;
    string self_link = 13; 
    repeated string route_table_ids = 14; // Added: ID of the associated route table 
    repeated string acl_ids = 15; // Added: ID of the associated ACL
    google.protobuf.Timestamp created_at = 17;
    google.protobuf.Timestamp updated_at = 18;
}


message ACL {
    string provider = 1;
    string id = 2;
    string name = 3;
    string vpc_id = 4;
    string region = 5;
    string account_id = 6;
    message ACLRule {
        int32 number = 1;
        string protocol = 2;
        string port_range = 3;
        repeated string source_ranges = 4;
        repeated string destination_ranges = 5;
        string action = 6;
        string direction = 7;
    }
    repeated ACLRule rules = 7;
    map<string, string> labels = 8;
    string project = 9;
    string last_sync_time = 10;
    string self_link = 11;
    google.protobuf.Timestamp created_at = 17;
    google.protobuf.Timestamp updated_at = 18;
}


message SecurityGroup {
    string provider = 1;
    string id = 2;
    string name = 3;
    string vpc_id = 4;
    string region = 5;
    string account_id = 6;
    message SecurityGroupRule {
        string protocol = 1;
        string port_range = 2;
        repeated string source = 3;
        string direction = 4;
    }
    repeated SecurityGroupRule rules = 7;
    map<string, string> labels = 8;
    string project = 9;

    string last_sync_time = 10;
    string self_link = 11;
    repeated string attached_running_instances = 12;
    google.protobuf.Timestamp created_at = 17;
    google.protobuf.Timestamp updated_at = 18;
    
    // Security risk assessment - populated during post-processing
    SecurityGroupRiskStatus risk_status = 19;
}


message RouteTable {
    string provider = 1;
    string id = 2;
    string name = 3;
    string vpc_id = 4;
    string region = 5;
    string account_id = 6;
    message Route {
        string destination = 1;
        string target = 2;
        string status = 3;
    }
    repeated Route routes = 7;
    repeated string subnet_ids = 8;
    repeated string igw_ids = 9;
    repeated string vgw_ids = 10;
    repeated string ngw_ids = 11;
    repeated string tgw_ids = 12;
    repeated string instance_ids = 13;
    repeated string network_interface_ids = 14;

    map<string, string> labels = 15;
    string project = 16;

    string last_sync_time = 17;
    string self_link = 18;
    google.protobuf.Timestamp created_at = 19;
    google.protobuf.Timestamp updated_at = 20;

}

message Router {
    string id = 1;
    string name = 2;
    string provider = 3;
    string region = 4;
    string vpc_id = 5;
    string state = 6;
    uint32 asn = 7;
    string advertised_range = 8;
    string advertised_group = 9;
    string vpn_type = 10;
    string subnet_id = 11;
    map<string, string> labels = 12;
    google.protobuf.Timestamp created_at = 13;
    google.protobuf.Timestamp updated_at = 14;
    string account_id = 15;
    string project = 16;
    string last_sync_time = 17;
    map<string, string> additional_properties = 18;
    string self_link = 19;
  }

  message NATGateway {
    string id = 1;
    string name = 2;
    string provider = 3;
    string account_id = 4;
    string vpc_id = 5;
    string region = 6;
    string state = 7;
    string public_ip = 8;
    string private_ip = 9;
    string subnet_id = 10;
    string project = 11;

    map<string, string> labels = 12;
    google.protobuf.Timestamp created_at = 13;
    google.protobuf.Timestamp updated_at = 14;
    string last_sync_time = 15;
    map<string, string> additional_properties = 16;
    string self_link = 17;
  }

  message IGW {
    string id = 1;
    string name = 2;
    string provider = 3;
    string account_id = 4;
    string attached_vpc_id = 5; // 
    string region = 6; // VPC Region
    string state = 7;
    string project = 8;

    map<string, string> labels = 11;
    google.protobuf.Timestamp created_at = 12;
    google.protobuf.Timestamp updated_at = 13;
    string last_sync_time = 14;
    string self_link = 15;
  }

  message VPCEndpoint {
    string id = 1;
    string name = 2;
    string provider = 3;
    string account_id = 4;
    string vpc_id = 5; //
    string region = 6; // VPC Region
    string state = 7;
    string type = 8; // e.g., Interface, Gateway
    string project = 9;

    string service_name = 10;
    repeated string route_table_ids = 11; // List of associated route table IDs (Gateway endpoints)
    repeated string subnet_ids = 12; // List of associated subnet IDs (Interface endpoints)
    map<string, string> labels = 13;
    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp updated_at = 15;
    string last_sync_time = 16;
    string self_link = 17;
    repeated string security_group_ids = 18; // List of associated security group IDs (Interface endpoints)
  }

  message PublicIP {
    string id = 1;
    string type = 2;
    string provider = 3;
    string account_id = 4;
    string vpc_id = 5; //
    string region = 6; 
    string public_ip = 7;
    string instance_id = 8; 
    string private_ip = 9;
    string byoip = 10;
    string project = 11;

    map<string, string> labels = 12;
    google.protobuf.Timestamp created_at = 13;
    google.protobuf.Timestamp updated_at = 14;
    string last_sync_time = 15;
    string network_interface_id = 16; // Added: ID of the associated network interface
    repeated string security_group_ids = 17; // Added: List of associated security group IDs
    repeated string subnet_ids = 18; // Added: List of associated subnet IDs
    string self_link = 19;
  }

  // Specifies the type of load balancer (e.g., Application, Network, Classic, Global)
enum LoadBalancerType {
    ALB = 0;
    NLB = 1;
    ELB = 2;
    GLB = 3;
    UNKNOWN = 4;
}

message LB {
    string id = 1;
    string name = 2;
    string load_balancer_type = 3;
    string scheme = 4;
    string vpc_id = 5;
    string dns_name = 6;  
    repeated string instance_ids = 7;
    repeated string subnet_ids = 8;
    repeated string security_group_ids =9;
    repeated string target_group_ids = 10;
    message Listener {
        string listener_id = 1;
        string protocol = 2;
        int32 port = 3;
        string target_group_id = 4;
    }
    repeated Listener listeners = 11;
    bool cross_zone_load_balancing = 12;
    bool access_logs_enabled = 13;
    string logging_bucket = 14;
    repeated string public_ip_addresses = 15;
    repeated string private_ip_addresses = 16;
    string state = 17; // e.g., "active", "provisioning", "failed"
    string ip_address_type = 18;
    string region = 19;
    string zone = 20;
    map<string, string> labels = 21;
    string project = 22;
    string provider = 23;
    string account_id = 24;
    string last_sync_time = 25;
    string self_link = 26;
    google.protobuf.Timestamp created_at = 27;
    google.protobuf.Timestamp updated_at = 28;
    
    // Security risk assessment - populated during post-processing
    LoadBalancerSecurityStatus security_status = 29;
}

message NetworkInterface {
    string id = 1;
    string name = 2;

    // Association with other resources
    string subnet_id = 3; // Association with Subnet
    string vpc_id = 4; // Association with VPC
    string instance_id = 5; // Association with Instance/VM

    // Network interface identifiers
    string mac_address = 6; // MAC address of the network interface
    string public_ip = 7; // Primary public IP address (if any)
    repeated string private_ips = 8; // Primary private IP address

    // Support for secondary private IP addresses (AWS, Azure, GCP)
    repeated string secondary_private_ips = 9;

    string status = 10;

    // Attachment details for how the interface is associated with an instance/VM
    message Attachment {
        string instance_id = 1;
        string attachment_id = 2;
        string device_index = 3; // The index of the device on the instance (e.g., eth0, eth1)
        google.protobuf.Timestamp attach_time = 4;
        bool delete_on_termination = 5; // Whether to delete the interface when the instance is terminated
    }
    Attachment attachment = 11;

    // DNS settings for the interface
    string dns_name = 12; // DNS name (if available)
    repeated string dns_servers = 13; // DNS servers assigned to the interface

    // Security groups associated with the interface
    repeated string security_group_ids = 14;

    // IP forwarding (used in cases like load balancers or NAT)
    bool ip_forwarding = 15;

    // Network performance metrics (e.g., bandwidth, MTU size)
    int32 mtu = 16; // Maximum Transmission Unit size
    string bandwidth = 17; // Bandwidth of the network interface

    // Cross-cloud compatibility fields
    string region = 18;
    string zone = 19;
    map<string, string> labels = 20;
    string project = 21;
    string provider = 22; // e.g., AWS, Azure, GCP
    string account_id = 23;
    string last_sync_time = 24;
    string self_link = 25;
    string interface_type = 26; // e.g., "eth0", "eth1"

    google.protobuf.Timestamp created_at = 27;
    google.protobuf.Timestamp updated_at = 28;
}

message VPNConcentrator {
    string id = 1;
    string name = 2;
    string provider = 3;
    string account_id = 4;
    string region = 5;

    string state = 6;
    string type = 7;
    string vpc_id = 8;
    int64 asn = 9;
    string project = 10;
    string last_sync_time = 11;
    string self_link = 12;
    map<string, string> labels = 13;

    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp updated_at = 15;
}
// Specifies the type of key pair (e.g., RSA, ED25519)


message KeyPair {
    string id = 1;
    string name = 2;
    
   
    string key_pair_type = 3;

    string public_key = 4;
    string private_key_fingerprint = 5; // Only store fingerprint for security

    // Association with instances/VMs
    repeated string instance_ids = 6;

    // Cross-cloud fields
    string region = 7;
    string project = 8;
    string provider = 9; // e.g., AWS, Azure, GCP
    string account_id = 10;
    map<string, string> labels = 11;
    string last_sync_time = 12;
    string self_link = 13;
    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp updated_at = 15;
}

// Node represents a resource in the VPC connectivity graph.
message VpcGraphNode {
    string id = 1; // Unique ID of the resource (e.g., instance ID, subnet ID)
    string resource_type = 2; // Type of the resource (e.g., "Instance", "Subnet", "RouteTable")
    string name = 3; // Display name of the resource
    map<string, string> properties = 4; // Key-value pairs for essential display properties (e.g., "privateIP", "cidrBlock", "state")
    string provider = 9; // e.g., AWS, Azure, GCP
    string account_id = 10;
    string region = 11; // Added Region
}

// Edge represents a connection or relationship between two nodes in the VPC graph.
message VpcGraphEdge {
    string source_node_id = 1; // ID of the source node
    string target_node_id = 2; // ID of the target node
    string relationship_type = 3; // Describes the relationship (e.g., "CONTAINS", "ROUTES_TO", "ASSOCIATED_WITH")
    string provider = 9; // e.g., AWS, Azure, GCP
    string account_id = 10;
    string region = 11; // Added Region
}

// Node represents a resource in the Instance connectivity graph.
// (Can be identical to VpcGraphNode initially)
message InstanceGraphNode {
    string id = 1; // Unique ID of the resource (e.g., instance ID, subnet ID)
    string resource_type = 2; // Type of the resource (e.g., "Instance", "Subnet", "RouteTable")
    string name = 3; // Display name of the resource
    map<string, string> properties = 4; // Key-value pairs for essential display properties (e.g., "privateIP", "cidrBlock", "state")
    string provider = 9; // e.g., AWS, Azure, GCP
    string account_id = 10;
    string region = 11; // Added Region
}

// Edge represents a connection or relationship between two nodes in the Instance graph.
// (Can be identical to VpcGraphEdge initially)
message InstanceGraphEdge {
    string source_node_id = 1; // ID of the source node
    string target_node_id = 2; // ID of the target node
    string relationship_type = 3; // Describes the relationship (e.g., "CONTAINS", "ROUTES_TO", "ASSOCIATED_WITH")
    string provider = 9; // e.g., AWS, Azure, GCP
    string account_id = 10;
    string region = 11; // Added Region
}


// ********************* // 
// VpcConnectionType specifies the mechanism used to connect two VPCs.
enum VpcConnectionType {
    VPC_CONNECTION_TYPE_UNSPECIFIED = 0;
    // Connection via a direct VPC peering link.
    VPC_CONNECTION_TYPE_PEERING = 1;
    // Connection via a centralized transit gateway.
    VPC_CONNECTION_TYPE_TRANSIT_GATEWAY = 2;
    // Connection via a VPC endpoint to a service in another VPC.
    VPC_ENDPOINT = 3;
    // A Transit VPC is a design pattern, not a single resource.
    // It involves a VPC acting as a hub with routing instances.
    // This type can be used to represent such logical connections
    // discovered through route analysis.
    TRANSIT_VPC = 4;
}


// Details for a VPC Peering connection.
message VpcPeeringConnectionDetails {
    // The parent VpcConnection message's vpc_id_1 and vpc_id_2 represent
    // the requester and accepter VPCs, respectively.
    string requester_vpc_owner_id = 1;
    string accepter_vpc_owner_id = 2;
    string requester_vpc_region = 3;
    string accepter_vpc_region = 4;
}

// Details for a connection via a Transit Gateway.
// This represents the logical link between two VPCs through a TGW.
message TransitGatewayConnectionDetails {
    string transit_gateway_id = 1;
    // A TGW connects VPCs via attachments. This connection is logical,
    // derived from routes in the TGW route table.
    string transit_gateway_attachment_id_1 = 2; // Attachment for vpc_id_1
    string transit_gateway_attachment_id_2 = 3; // Attachment for vpc_id_2
    string transit_gateway_route_table_id = 4; // The route table enabling this connection.
}

// Details for a connection via a VPC Endpoint Service.
// This is typically a unidirectional connection from a consumer VPC to a provider VPC.
message VpcEndpointConnectionDetails {
    string vpc_endpoint_id = 1; // In the consumer VPC (e.g., vpc_id_1)
    string service_name = 2; // The endpoint service name
    string service_id = 3; // The endpoint service ID in the provider VPC (e.g., vpc_id_2)
}

// Details for a connection via a Transit VPC pattern.
message TransitVpcConnectionDetails {
    string transit_vpc_id = 1; // The ID of the VPC acting as the hub.
    string router_instance_id = 2; // The instance in the transit VPC doing the routing.
}

// Represents a connection between two VPCs, potentially across different accounts.
message VpcConnection {
    string id = 1; // Unique ID for the connection, e.g., peering connection ID.
    string name = 2;
    string provider = 3;
    string account_id = 4; // Owner/primary account of the connection resource
    string region = 5; // Primary region of the connection resource.

    // First VPC details
    string vpc_id_1 = 6;
    string vpc_1_account_id = 7;  // Account ID for first VPC
    string vpc_1_region = 8;      // Region for first VPC

    // Second VPC details 
    string vpc_id_2 = 9;
    string vpc_2_account_id = 10; // Account ID for second VPC
    string vpc_2_region = 11;     // Region for second VPC

    // The type of connection.
    VpcConnectionType connection_type = 12;

    // Details specific to the connection type.
    oneof connection_details {
        VpcPeeringConnectionDetails vpc_peering_details = 13;
        TransitGatewayConnectionDetails transit_gateway_details = 14;
        VpcEndpointConnectionDetails vpc_endpoint_details = 15;
        TransitVpcConnectionDetails transit_vpc_details = 16;
    }

    string status = 17; // e.g., "active", "pending", "failed"
    map<string, string> labels = 18;
    google.protobuf.Timestamp created_at = 19;
    string self_link = 20;
    string last_sync_time = 21;
}

message VpcInternalGraph {


    // All VPC connections discovered in the account
    repeated VpcConnection connections = 1;

    // All nodes representing VPCs, Transit Gateways, etc.
    repeated VpcGraphNode nodes = 2;

    // All edges representing connections between nodes
    repeated VpcGraphEdge edges = 3;

    // Cross-account/region information
    string account_id = 4;
    string region = 5;
    string provider = 6;

    map<string, string> labels = 7;
    string last_sync_time = 8;
}

// Represents a complete view of VPC connectivity across accounts and regions
message VpcConnectionGraph {
    // All nodes in the graph (VPCs, Transit Gateways, VPC Endpoints, etc)
    repeated VpcConnectionGraphNode nodes = 1;
    
    // All edges representing connections between nodes
    repeated VpcConnectionGraphEdge edges = 2;

    VpcInternalGraph src_vpc_graph = 3;
    VpcInternalGraph dest_vpc_graph = 4; // The source VPC connectivity graph this is derived from
    
    // Graph metadata
    // Cross-account/region information
    string account_id = 5;
    string region = 6;
    string provider = 7;

    map<string, string> labels = 8;
    string last_sync_time = 9;
}

// Enhanced node type that can represent any component in the VPC connection graph
message VpcConnectionGraphNode {
    string id = 1;
    string name = 2;
    
    // The type of resource this node represents
    enum NodeType {
        NODE_TYPE_UNSPECIFIED = 0;
        VPC = 1;
        TRANSIT_GATEWAY = 2;
        VPC_ENDPOINT = 3;
        TRANSIT_VPC = 4;
        INTERNET_GATEWAY = 5;
        VPN_GATEWAY = 6;
        NAT_GATEWAY = 7;
    }
    NodeType node_type = 3;
    
    // Node properties based on type
    oneof type_properties {
        VPC vpc = 4;
        TransitGatewayDetails tgw = 5;
        VPCEndpoint endpoint = 6;
    }
    
    // Cross-account/region information
    string account_id = 7;
    string region = 8;
    string provider = 9;
    
    // Additional metadata
    map<string, string> properties = 10;
    map<string, string> labels = 11;
}

// Enhanced edge type for VPC connection graph
message VpcConnectionGraphEdge {
    string id = 1;
    string source_node_id = 2;
    string target_node_id = 3;
    
    // The type of connection this edge represents
    VpcConnectionType connection_type = 4;
    
    // Connection details based on type
    oneof connection_details {
        VpcPeeringConnectionDetails peering_details = 5;
        TransitGatewayConnectionDetails transit_gateway_details = 6;
        VpcEndpointConnectionDetails endpoint_details = 7;
        TransitVpcConnectionDetails transit_vpc_details = 8;
    }
    
    // Edge properties
    string status = 9;          // active, pending, failed
    bool bidirectional = 10;    // Whether traffic can flow both ways

     // Cross-account/region information
    string account_id = 11;
    string region = 12;
    string provider = 13;
    
    
    // Cross-account/region metadata
    repeated string route_table_ids = 14;  // Route tables implementing this connection
    map<string, string> properties = 15;   // Additional properties (bandwidth, latency, etc)
}

// Additional details for Transit Gateway nodes
message TransitGatewayDetails {
    string transit_gateway_id = 1;
    repeated string attachment_ids = 2;
    repeated string route_table_ids = 3;
    string state = 4;
    uint32 asn = 5;
    map<string, string> properties = 6;

    // Cross-account/region information
    string account_id = 11;
    string region = 12;
    string provider = 13;
}